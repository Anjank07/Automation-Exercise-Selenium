name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest   # Chrome is preinstalled; Selenium Manager fetches the driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --headless
      - uses: actions/upload-artifact@v4
        if: always()   # upload the report (and failure screenshots) even when tests fail
        with:
          name: test-report
          path: reports/
